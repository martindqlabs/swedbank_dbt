version: 2

sources:
  - name: source_systems
    schema: SOURCE_SYSTEMS
    description: "Raw extracts as if pulled from core banking, the IRB rating engine, Treasury's FX feed, and collateral management (01_source_systems)."
    tables:
      - name: src_customers
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: src_loans
        columns:
          - name: loan_id
            tests: [unique, not_null]
      - name: src_collateral
      - name: src_credit_ratings
      - name: src_fx_rates
      - name: src_npl_status

  - name: governance_metadata
    schema: GOVERNANCE_METADATA
    description: "The evidence layer: CDE ownership, DQ rule definitions, daily pass/fail history, lineage, and incidents (04_governance_metadata)."
    tables:
      - name: cde_registry
      - name: dq_rule_catalog
      - name: dq_check_results_log
      - name: lineage_map
      - name: incident_log
